# A separate release gate: source-repository policy changes cannot weaken this.
[licenses]
include-dev = true
include-build = true
confidence-threshold = 0.95
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "NCSA",
  "CC0-1.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
