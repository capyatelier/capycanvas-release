name: Deploy editor

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Capy Canvas branch, tag or commit to deploy
        default: main

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          commit=$(gh api "repos/capyatelier/capycanvas/commits/$REF" -q .sha)
          if [ "$commit" = "$(jq -r .commit release/source.json)" ]; then echo "$commit is already deployed"; exit 0; fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - if: steps.source.outputs.commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: capyatelier/capycanvas
          ref: ${{ steps.source.outputs.commit }}
          path: source
          persist-credentials: false
      - if: steps.source.outputs.commit
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - if: steps.source.outputs.commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          rust=$(sed -n 's/^  RUST_VERSION: "\(.*\)"$/\1/p' source/.github/workflows/release.yml)
          jq --arg commit "$COMMIT" --arg rust "${rust:?}" '.commit = $commit | .rust = $rust' release/source.json > "$RUNNER_TEMP/source.json"
          mv "$RUNNER_TEMP/source.json" release/source.json
          pin() { jq -r ".$1" release/source.json; }
          rustup toolchain install "$(pin rust)" --profile minimal --component rust-docs --component rust-src --target wasm32-unknown-unknown
          rustup default "$(pin rust)"
          cargo install --locked wasm-bindgen-cli --version "$(pin wasmBindgen)"
          cargo install --locked cargo-about --features cli --version "$(pin cargoAbout)"
          cargo install --locked cargo-deny --version "$(pin cargoDeny)"
          cargo install --locked resvg --version "$(pin resvg)"
          node release/build.mjs source --skip-tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc release/manifest.json release/source.json
          git commit -m "Deploy editor source ${COMMIT:0:7}"
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
